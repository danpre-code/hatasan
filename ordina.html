<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ordina Online | Hata San Bologna</title>
    <link rel="alternate" hreflang="it" href="ordina.html">
    <link rel="alternate" hreflang="en" href="en/order.html">
    <link rel="alternate" hreflang="x-default" href="ordina.html">
    <meta name="description" content="Ordina online Take Away e Delivery da Hata San a Bologna: Sushi, Tartare, Sashimi, Uramaki, Wagyu A5 e specialità alla griglia Robatayaki. Consegna gratuita entro 5 km.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Montserrat:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="navigation.css">
    <link rel="stylesheet" href="fire-background.css">
    <script src="navigation.js" defer></script>
    <style>
        :root {
            --bg-dark: #000000;
            --text-light: #f5f5f5;
            --accent-gold: #c5a059;
            --accent-gold-hover: #d6b36a;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        .zuma-font { font-family: 'Cinzel', serif; }
        .nav-scrolled { background-color: rgba(5, 5, 5, 0.95); backdrop-filter: blur(10px); }
        .btn-outline {
            border: 1px solid rgba(255,255,255,0.3); padding: 0.75rem 1.5rem; text-transform: uppercase;
            letter-spacing: 0.2em; font-size: 0.75rem; transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            position: relative; overflow: hidden; display: inline-block; backdrop-filter: blur(5px);
        }
        .btn-outline::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: #fff;
            transform: scaleX(0); transform-origin: left; transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1); z-index: -1;
        }
        .btn-outline:hover { color: #000; border-color: #fff; }
        .btn-outline:hover::before { transform: scaleX(1); }

        /* Scorrimento fluido per la barra categorie mobile */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-x: contain;
            touch-action: pan-x;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(197, 160, 89, 0.3); border-radius: 2px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(197, 160, 89, 0.6); }

        .cat-pill {
            transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
            white-space: nowrap;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .cat-pill.active {
            background-color: var(--accent-gold);
            color: #000000;
            font-weight: 600;
            border-color: var(--accent-gold);
        }

        /* Card ottimizzate per 60fps su mobile */
        .dish-card {
            background-color: #0d0d0d;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: border-color 0.2s ease, background-color 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }
        @media (hover: hover) {
            .dish-card:hover {
                background-color: #151515;
                border-color: rgba(197, 160, 89, 0.45);
            }
        }
        .dish-card.in-cart {
            border-left: 3px solid var(--accent-gold);
            background-color: #12100c;
        }

        @media (prefers-reduced-motion: reduce) {
            .btn-outline, .btn-outline::before, .dish-card, .cat-pill { transition: none; }
        }
    </style>
</head>

    <!-- CONTENUTO PRINCIPALE ORDINI -->
    <div class="fire-content relative z-10 pt-20 md:pt-28 flex-1 flex flex-col">

        <!-- BARRA DI SERVIZIO -->
        <section class="bg-black/90 border-b border-white/10 pt-4 pb-4 px-4 md:px-12">
            <div class="max-w-7xl mx-auto">
                <a href="index.html" class="inline-flex items-center gap-2 text-[10px] tracking-[0.2em] uppercase text-gray-400 hover:text-[var(--accent-gold)] transition-colors mb-3">
                    <svg class="icon-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
                    Torna alla home
                </a>

                <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
                    <div>
                        <div class="flex flex-wrap items-center gap-2.5 mb-1.5">
                            <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[10px] font-medium uppercase tracking-widest bg-emerald-950/80 text-emerald-400 border border-emerald-700/40">
                                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                                Take Away &amp; Delivery
                            </span>
                            <span class="text-xs text-gray-400 tracking-wider">Via Augusto Murri, 77 · Bologna</span>
                        </div>
                        <h1 class="text-xl md:text-3xl zuma-font text-white tracking-wider uppercase">
                            Ordina <span class="text-[var(--accent-gold)]">Online</span>
                        </h1>
                        <!-- Badge Consegna Gratuita & Ordine Minimo (Visibile subito su Desktop e Mobile) -->
                        <div class="mt-2.5 inline-flex items-center gap-2 px-3 py-1.5 rounded-lg bg-[var(--accent-gold)]/10 border border-[var(--accent-gold)]/35 text-[11px] md:text-xs text-[var(--accent-gold)] font-medium tracking-wide">
                            <svg class="w-4 h-4 shrink-0 text-[var(--accent-gold)]" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M13 16V6a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h1m8-1a1 1 0 01-1 1H9m4-1V8a1 1 0 011-1h2.586a1 1 0 01.707.293l3.414 3.414a1 1 0 01.293.707V16a1 1 0 01-1 1h-1m-6-1a1 1 0 001 1h1M5 17a2 2 0 104 0m-4 0a2 2 0 114 0m6 0a2 2 0 104 0m-4 0a2 2 0 114 0"/>
                            </svg>
                            <span>Consegna gratuita (entro 5 km) - Ordine minimo 30€</span>
                        </div>
                    </div>

                    <!-- Selettori Ritiro/Consegna + Fascia Oraria -->
                    <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-2.5">
                        <div class="bg-zinc-900 p-1 rounded-lg border border-white/10 flex items-center">
                            <button id="btn-pickup" type="button" onclick="setServiceMode('pickup')" class="flex-1 sm:flex-initial px-4 py-2 rounded-md text-xs uppercase tracking-widest font-medium transition-all bg-[var(--accent-gold)] text-black">
                                Ritiro (Pickup)
                            </button>
                            <button id="btn-delivery" type="button" onclick="setServiceMode('delivery')" class="flex-1 sm:flex-initial px-4 py-2 rounded-md text-xs uppercase tracking-widest font-medium transition-all text-gray-400 hover:text-white">
                                Consegna
                            </button>
                        </div>

                        <div class="relative">
                            <select id="time-slot-select" aria-label="Seleziona fascia oraria" onchange="updateTimeSlot(this.value)" class="w-full sm:w-auto appearance-none bg-zinc-900 border border-white/10 hover:border-[var(--accent-gold)]/50 text-white text-xs tracking-wider rounded-lg pl-9 pr-8 py-2.5 focus:outline-none focus:border-[var(--accent-gold)] transition-colors cursor-pointer">
                                <option value="Oggi • Appena possibile">Oggi • Appena possibile</option>
                                <optgroup label="Pranzo (Ven – Dom 12:00 – 14:30)">

                                    <option value="Pranzo • 13:00">Pranzo • 13:00</option>
                                    <option value="Pranzo • 13:30">Pranzo • 13:30</option>
                                    <option value="Pranzo • 14:00">Pranzo • 14:00</option>
                                </optgroup>
                                <optgroup label="Cena (Lun – Dom 19:00 – 23:30)">
                                    <option value="Cena • 19:30">Cena • 19:30</option>
                                    <option value="Cena • 20:00">Cena • 20:00</option>
                                    <option value="Cena • 20:30">Cena • 20:30</option>
                                    <option value="Cena • 21:00">Cena • 21:00</option>
                                    <option value="Cena • 21:30">Cena • 21:30</option>
                                    <option value="Cena • 22:00">Cena • 22:00</option>
                                </optgroup>
                            </select>
                            <svg class="w-4 h-4 text-[var(--accent-gold)] absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                            <svg class="w-3.5 h-3.5 text-gray-400 absolute right-2.5 top-
